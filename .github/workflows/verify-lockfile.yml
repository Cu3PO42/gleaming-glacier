name: Verify action lockfile

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify action lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install lockfile generator
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify locked action dependencies
        run: gh actions-lock --verify
