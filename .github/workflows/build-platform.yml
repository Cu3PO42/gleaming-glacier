name: Build platform

on:
  workflow_call:
    inputs:
      matrix:
        description: Prerequisite package, independent package, and configuration matrices for one platform
        type: string
        required: true
      manifest-version:
        description: Hestia cache manifest containing the evaluated derivations
        type: string
        required: true
      build-config:
        description: Shared Nix settings, upstream filter, and upload policy as JSON
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

env:
  NIX_CONFIG: ${{ fromJSON(inputs.build-config).nixConfig }}

jobs:
  packages:
    name: ${{ matrix.name }} (${{ matrix.system }})
    if: fromJSON(inputs.matrix).any-packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix).packages }}
    steps: &build-steps
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: ${{ fromJSON(inputs.build-config).upstreamCacheKeyNames }}
          wait-manifest-version: ${{ inputs.manifest-version }}
      - name: Set up niks3 uploads
        id: niks3
        if: fromJSON(inputs.build-config).cacheUpload
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ fromJSON(inputs.build-config).cacheServerUrl }}
          # Hestia owns the post-build hook; push completed outputs explicitly.
          skip-push: true
      - name: Build
        env:
          INSTALLABLES: ${{ matrix.installables }}
        run: |
          read -r -a installables <<< "$INSTALLABLES"
          "$HESTIA_BIN" prefetch "${installables[@]}"
          nix build -L --no-link --print-out-paths "${installables[@]}" > "$RUNNER_TEMP/build-outputs"
      - name: Push outputs to niks3
        if: fromJSON(inputs.build-config).cacheUpload
        env:
          NIKS3_SERVER_URL: ${{ fromJSON(inputs.build-config).cacheServerUrl }}
          NIKS3_BIN: ${{ steps.niks3.outputs.binary-dir }}
          NIKS3_AUTH_TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          test -n "$NIKS3_AUTH_TOKEN_SCRIPT"
          outputs=()
          while IFS= read -r output; do outputs+=("$output"); done < "$RUNNER_TEMP/build-outputs"
          test "${#outputs[@]}" -gt 0
          # niks3 keeps complete closures; Hestia's upstream filter is separate.
          "$NIKS3_BIN/niks3" push --auth-token-script "$NIKS3_AUTH_TOKEN_SCRIPT" "${outputs[@]}"

  other-packages:
    name: ${{ matrix.name }} (${{ matrix.system }})
    # These packages/checks are not prerequisites of any pending configuration.
    if: fromJSON(inputs.matrix).any-other-packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix).other-packages }}
    steps: *build-steps

  configurations:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: packages
    # Wait only for packages used by this platform's pending configurations.
    if: >-
      ${{ !cancelled()
          && (needs.packages.result == 'success' || needs.packages.result == 'skipped')
          && fromJSON(inputs.matrix).any-configurations }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix).configurations }}
    steps: *build-steps
