name: Nix CI

on:
  push:
    branches-ignore: [deploy]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # The eval job forwards these settings to every build via build-config.
  NIX_CONFIG: |
    accept-flake-config = true
    extra-substituters = https://nix-community.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test CI helpers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -p 'test_ci_*.py'

  eval:
    name: Evaluate build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
      build-config: ${{ steps.config.outputs.config }}
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@main
      - name: Prepare shared build configuration
        id: config
        run: |
          cache_config=$(nix eval --json --file ./shared/nix-cache.nix)
          build_config=$(jq -c --arg nixConfig "$NIX_CONFIG" \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg event "$GITHUB_EVENT_NAME" '
            {
              nixConfig: $nixConfig,
              cacheServerUrl: .upload.url,
              upstreamCacheKeyNames: (.ci.upstreamCacheKeyNames | join(" ")),
              cacheUpload: (
                (.ci.repositories | index($repository) != null)
                and (.ci.refs | index($ref) != null)
                and ($event == "push" or $event == "workflow_dispatch")
              )
            }
          ' <<< "$cache_config")
          echo "config=$build_config" >> "$GITHUB_OUTPUT"
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          upstream-cache-key-names: ${{ fromJSON(steps.config.outputs.config).upstreamCacheKeyNames }}
          filter-drv-closures: true
      - id: matrix
        uses: Mic92/hestia/matrix@v3
        env:
          CACHE_UPLOAD: ${{ fromJSON(steps.config.outputs.config).cacheUpload }}
        with:
          flake: .#ciJobs
          # Use the flake's locked nixpkgs, including for the evaluation tool.
          nix-eval-jobs: bash ci/nix-eval-jobs.sh --workers 1 --max-memory-size 4096
          runner-map: |
            x86_64-linux=ubuntu-24.04
            aarch64-linux=ubuntu-24.04-arm
            aarch64-darwin=macos-15
      - name: Split matrix by platform and configuration dependencies
        id: split
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          platforms=$(python3 ci/matrix.py <<< "$MATRIX")
          echo "matrix=$platforms" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.system }}
    needs: eval
    if: needs.eval.outputs.any-jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eval.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      matrix: ${{ toJSON(matrix) }}
      manifest-version: ${{ needs.eval.outputs.manifest-version }}
      build-config: ${{ needs.eval.outputs.build-config }}

  result:
    name: Nix CI result
    runs-on: ubuntu-24.04
    needs: [tests, eval, build]
    if: always()
    steps:
      - name: Check results
        env:
          TESTS: ${{ needs.tests.result }}
          EVAL: ${{ needs.eval.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          [[ "$TESTS" == success ]]
          [[ "$EVAL" == success ]]
          [[ "$BUILD" == success || "$BUILD" == skipped ]]

  promote:
    name: Advance deploy branch
    runs-on: ubuntu-24.04
    needs: [eval, result]
    if: >-
      ${{ !cancelled()
          && needs.result.result == 'success'
          && github.ref == 'refs/heads/master'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && fromJSON(needs.eval.outputs.build-config).cacheUpload }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Promote the tested commit
        run: bash ci/promote-deploy.sh
