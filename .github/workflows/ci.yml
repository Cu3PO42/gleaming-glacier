name: Nix CI

on:
  push:
    branches-ignore: [deploy, 'dependabot/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # The eval job forwards these settings to every build via build-config.
  NIX_CONFIG: |
    accept-flake-config = true
    extra-substituters = https://nix-community.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      x86_64-linux: ${{ steps.split.outputs.x86_64-linux }}
      aarch64-linux: ${{ steps.split.outputs.aarch64-linux }}
      aarch64-darwin: ${{ steps.split.outputs.aarch64-darwin }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
      build-config: ${{ steps.config.outputs.config }}
      cached-outputs: ${{ steps.split.outputs.cached-outputs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - name: Prepare shared build configuration
        id: config
        run: |
          cache_config=$(nix eval --json --file ./ci/cache.nix)
          build_config=$(jq -c --arg nixConfig "$NIX_CONFIG" \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg event "$GITHUB_EVENT_NAME" '
            {
              nixConfig: $nixConfig,
              cacheServerUrl: .upload.url,
              upstreamCacheKeyNames: (.hestia.upstreamCacheKeyNames | join(" ")),
              cacheUpload: (
                (.ci.repositories | index($repository) != null)
                and (.ci.refs | index($ref) != null)
                and ($event == "push" or $event == "workflow_dispatch")
              )
            }
          ' <<< "$cache_config")
          echo "config=$build_config" >> "$GITHUB_OUTPUT"
      - uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
          upstream-cache-key-names: ${{ fromJSON(steps.config.outputs.config).upstreamCacheKeyNames }}
          filter-drv-closures: true
      - id: matrix
        uses: Mic92/hestia/matrix@v3.1.0
        env:
          NIX_EVAL_JOBS_OUTPUT: ${{ runner.temp }}/ci-evaluation.jsonl
        with:
          flake: .#ciJobs
          # Use the flake's locked nixpkgs, including for the evaluation tool.
          nix-eval-jobs: bash ci/nix-eval-jobs.sh --workers 1 --max-memory-size 4096
          runner-map: |
            x86_64-linux=ubuntu-24.04
            aarch64-linux=ubuntu-24.04-arm
            aarch64-darwin=macos-15
      - name: Validate derivation cache handoff
        env:
          ANY_JOBS: ${{ steps.matrix.outputs.any-jobs }}
          MANIFEST_VERSION: ${{ steps.matrix.outputs.manifest-version }}
        run: bash ci/check-handoff.sh
      - name: Split matrix by platform and configuration dependencies
        id: split
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          platforms=$(python3 ci/matrix.py <<< "$MATRIX")
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            platform=$(jq -c --arg system "$system" '.include[] | select(.system == $system)' <<< "$platforms")
            echo "$system=$platform" >> "$GITHUB_OUTPUT"
          done
          cached_outputs=$(python3 ci/cached_outputs.py < "$RUNNER_TEMP/ci-evaluation.jsonl")
          echo "cached-outputs=$cached_outputs" >> "$GITHUB_OUTPUT"

  build-x86_64-linux:
    name: x86_64-linux
    needs: eval
    if: needs.eval.outputs.x86_64-linux != ''
    uses: ./.github/workflows/build-platform.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      matrix: ${{ needs.eval.outputs.x86_64-linux }}
      manifest-version: ${{ needs.eval.outputs.manifest-version }}
      build-config: ${{ needs.eval.outputs.build-config }}

  build-aarch64-linux:
    name: aarch64-linux
    needs: eval
    if: needs.eval.outputs.aarch64-linux != ''
    uses: ./.github/workflows/build-platform.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      matrix: ${{ needs.eval.outputs.aarch64-linux }}
      manifest-version: ${{ needs.eval.outputs.manifest-version }}
      build-config: ${{ needs.eval.outputs.build-config }}

  build-aarch64-darwin:
    name: aarch64-darwin
    needs: eval
    if: needs.eval.outputs.aarch64-darwin != ''
    uses: ./.github/workflows/build-platform.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      matrix: ${{ needs.eval.outputs.aarch64-darwin }}
      manifest-version: ${{ needs.eval.outputs.manifest-version }}
      build-config: ${{ needs.eval.outputs.build-config }}

  upload-cached:
    name: Upload cached outputs to niks3
    needs: eval
    if: >-
      ${{ fromJSON(needs.eval.outputs.build-config).cacheUpload
          && needs.eval.outputs.cached-outputs != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      NIX_CONFIG: ${{ fromJSON(needs.eval.outputs.build-config).nixConfig }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          read-only: true
          wait-manifest-version: ${{ needs.eval.outputs.manifest-version }}
      - uses: Mic92/niks3-action@v1.10.0
        id: niks3
        with:
          server-url: ${{ fromJSON(needs.eval.outputs.build-config).cacheServerUrl }}
          skip-push: true
      - name: Restore and push cached output closures
        env:
          CACHED_OUTPUTS: ${{ needs.eval.outputs.cached-outputs }}
          NIKS3_SERVER_URL: ${{ fromJSON(needs.eval.outputs.build-config).cacheServerUrl }}
          NIKS3_BIN: ${{ steps.niks3.outputs.binary-dir }}
          NIKS3_AUTH_TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: python3 ci/backfill.py

  result:
    name: Nix CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [eval, build-x86_64-linux, build-aarch64-linux, build-aarch64-darwin, upload-cached]
    if: always()
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check results
        env:
          EVAL: ${{ needs.eval.result }}
          BUILD_X86_64_LINUX: ${{ needs.build-x86_64-linux.result }}
          BUILD_AARCH64_LINUX: ${{ needs.build-aarch64-linux.result }}
          BUILD_AARCH64_DARWIN: ${{ needs.build-aarch64-darwin.result }}
          UPLOAD_CACHED: ${{ needs.upload-cached.result }}
          EXPECTED_BUILD_X86_64_LINUX: ${{ needs.eval.outputs.x86_64-linux != '' && 'success' || 'skipped' }}
          EXPECTED_BUILD_AARCH64_LINUX: ${{ needs.eval.outputs.aarch64-linux != '' && 'success' || 'skipped' }}
          EXPECTED_BUILD_AARCH64_DARWIN: ${{ needs.eval.outputs.aarch64-darwin != '' && 'success' || 'skipped' }}
          EXPECTED_UPLOAD: >-
            ${{ needs.eval.outputs.build-config != ''
                && fromJSON(needs.eval.outputs.build-config).cacheUpload
                && needs.eval.outputs.cached-outputs != '[]'
                && 'success' || 'skipped' }}
        run: bash ci/check-results.sh

  promote:
    name: Advance deploy branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [eval, result]
    if: >-
      ${{ !cancelled()
          && needs.result.result == 'success'
          && github.ref == 'refs/heads/master'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && fromJSON(needs.eval.outputs.build-config).cacheUpload }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Promote the tested commit
        run: bash ci/promote-deploy.sh
