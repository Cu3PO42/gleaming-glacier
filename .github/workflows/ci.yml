name: Nix CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Build jobs have no checkout, so repeat the flake's additional cache here.
  NIX_CONFIG: |
    accept-flake-config = true
    extra-substituters = https://nix-community.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Test matrix partitioning
        run: python3 -m unittest discover -s tests -p 'test_ci_matrix.py'
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          filter-drv-closures: true
      - id: matrix
        uses: Mic92/hestia/matrix@v3
        with:
          flake: .#ciJobs
          # Use the flake's locked nixpkgs, including for the evaluation tool.
          nix-eval-jobs: nix run --inputs-from . nixpkgs#nix-eval-jobs -- --workers 1 --max-memory-size 4096
          runner-map: |
            x86_64-linux=ubuntu-24.04
            aarch64-linux=ubuntu-24.04-arm
            aarch64-darwin=macos-15
      - name: Split matrix by platform and configuration dependencies
        id: split
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          platforms=$(python3 ci/matrix.py <<< "$MATRIX")
          echo "matrix=$platforms" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.system }}
    needs: eval
    if: needs.eval.outputs.any-jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eval.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      matrix: ${{ toJSON(matrix) }}
      manifest-version: ${{ needs.eval.outputs.manifest-version }}

  result:
    name: Nix CI result
    runs-on: ubuntu-24.04
    needs: [eval, build]
    if: always()
    steps:
      - name: Check results
        env:
          EVAL: ${{ needs.eval.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          [[ "$EVAL" == success ]]
          [[ "$BUILD" == success || "$BUILD" == skipped ]]
